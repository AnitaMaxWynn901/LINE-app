<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Master Dashboard</title>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding-bottom: 20px;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
        }

        .header h1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            word-wrap: break-word;
            line-height: 1.3;
        }

        .header p {
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            min-width: 0;
        }

        .stat-card h3 {
            font-size: 12px;
            color: #666;
        }

        .stat-card .value {
            font-size: clamp(1.25rem, 5vw, 28px);
            font-weight: bold;
            color: #667eea;
            word-break: break-word;
        }

        .section {
            padding: 0 16px 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filters input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .filters input[type="date"] {
            min-width: 120px;
        }

        .btn-filter {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            min-width: 0;
            padding: 10px 8px;
            border: none;
            background: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .order-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .order-row .label {
            color: #666;
            flex-shrink: 0;
        }

        .order-row .value {
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            min-width: 0;
        }

        .order-details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            overflow-wrap: break-word;
        }

        .order-details p {
            margin: 4px 0 0;
            word-break: break-word;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-complete {
            background: #28a745;
            color: white;
        }

        .btn-completed {
            background: #6c757d;
            color: white;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Responsive: mobile-first overrides for small screens */
        @media (max-width: 600px) {
            .header {
                padding: 14px 16px;
            }

            .stats-grid {
                gap: 10px;
                padding: 12px 16px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-card h3 {
                font-size: 11px;
            }

            .section {
                padding: 0 16px 16px;
            }

            .filters {
                flex-direction: column;
            }

            .filters input,
            .filters input[type="date"] {
                width: 100%;
                min-width: 0;
            }

            .btn-filter {
                width: 100%;
            }

            .tabs {
                gap: 6px;
            }

            .tab {
                padding: 10px 6px;
                font-size: 13px;
            }

            .order-card {
                padding: 12px;
            }

            .order-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            .order-header strong {
                word-break: break-word;
            }

            .order-status {
                flex-shrink: 0;
            }
        }

        @media (max-width: 380px) {
            .stat-card .value {
                font-size: 1.1rem;
            }

            .tab {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>👨‍🍳 Shop Master Dashboard</h1>
        <p>Sushi Cafe</p>
    </div>

    <div id="loading" class="loading">Loading dashboard...</div>

    <div id="dashboard" class="hidden">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Pending Orders</h3>
                <div id="statPending" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed Today</h3>
                <div id="statCompleted" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <div id="statRevenue" class="value">$0</div>
            </div>
            <div class="stat-card">
                <h3>Total Customers</h3>
                <div id="statCustomers" class="value">0</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">📦 Orders</h2>

            <div class="filters">
                <input id="searchInput" placeholder="Search customer or order..." oninput="applyFilters()" />
                <input type="date" id="startDate" onchange="applyFilters()" />
                <input type="date" id="endDate" onchange="applyFilters()" />
                <button class="btn-filter" onclick="resetFilters()">Reset</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('pending', event)">Pending</button>
                <button class="tab" onclick="switchTab('completed', event)">Completed</button>
                <button class="tab" onclick="switchTab('all', event)">All</button>
            </div>

            <div id="pendingOrders"></div>
            <div id="allOrders" class="hidden"></div>
        </div>
    </div>

    <script>
        const LIFF_ID = '2008995030-d47ws6I6';
        const API_URL = 'https://line-app-94vb.onrender.com';

        let currentTab = 'pending';
        let allOrders = [];
        let filteredOrders = [];

        async function initializeLIFF() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) return liff.login();

            const profile = await liff.getProfile();
            const userRes = await fetch(`${API_URL}/api/user/${profile.userId}`);
            const user = await userRes.json();

            if (user.userRole !== 'shop_master' && user.userRole !== 'admin') {
                alert('Access denied');
                return liff.closeWindow();
            }

            loadDashboard();
        }

        async function loadDashboard() {
            const res = await fetch(`${API_URL}/api/dashboard/shop`);
            const result = await res.json();

            allOrders = result.data.recentOrders;
            filteredOrders = [...allOrders];

            document.getElementById('statPending').textContent = result.data.statistics.pendingOrders;
            document.getElementById('statCompleted').textContent = result.data.statistics.todayOrders;
            document.getElementById('statRevenue').textContent = '$' + result.data.statistics.totalRevenue;
            document.getElementById('statCustomers').textContent = result.data.statistics.totalCustomers;

            displayOrders();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            filteredOrders = allOrders.filter(o => {
                const matchSearch =
                    o.display_name.toLowerCase().includes(search) ||
                    o.order_details.toLowerCase().includes(search) ||
                    String(o.order_id).includes(search);

                const date = new Date(o.order_date).toISOString().split('T')[0];
                const matchDate =
                    (!start || date >= start) &&
                    (!end || date <= end);

                return matchSearch && matchDate;
            });

            displayOrders();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            filteredOrders = [...allOrders];
            displayOrders();
        }

        function displayOrders() {
            let orders =
                currentTab === 'pending'
                    ? filteredOrders.filter(o => o.order_status === 'pending')
                    : currentTab === 'completed'
                        ? filteredOrders.filter(o => o.order_status === 'completed')
                        : filteredOrders;

            const container =
                currentTab === 'pending' ? document.getElementById('pendingOrders') : document.getElementById('allOrders');

            if (!orders.length) {
                container.innerHTML = '<div class="loading">No matching orders</div>';
                return;
            }

            container.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <strong>Order #${o.order_id}</strong>
            <span class="order-status status-${o.order_status}">${o.order_status.toUpperCase()}</span>
          </div>

          <div class="order-row"><span class="label">👤 Customer</span><span class="value">${o.display_name}</span></div>

          <div class="order-details"><strong>🍣 Order</strong><p>${o.order_details}</p></div>

          <div class="order-row"><span class="label">💰 Total</span><span class="value">$${o.total_amount}</span></div>
          <div class="order-row"><span class="label">📅 Date</span><span class="value">${new Date(o.order_date).toLocaleString()}</span></div>

          ${o.order_status === 'pending'
                    ? `<button class="btn btn-complete" onclick="completeOrder(${o.order_id})">Mark Completed</button>`
                    : `<button class="btn btn-completed" disabled>Completed</button>`}
        </div>
      `).join('');
        }

        function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('pendingOrders').classList.toggle('hidden', tab !== 'pending');
            document.getElementById('allOrders').classList.toggle('hidden', tab === 'pending');

            displayOrders();
        }

        async function completeOrder(id) {
            if (!confirm('Mark order as completed?')) return;

            await fetch(`${API_URL}/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'completed' })
            });

            loadDashboard();
        }

        setInterval(loadDashboard, 30000);
        window.addEventListener('load', initializeLIFF);
    </script>
</body>

</html>
