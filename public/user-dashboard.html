<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .points {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .section {
            padding: 0 20px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .completed {
            background: #d4edda;
            color: #155724;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .order-details {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .order-meta {
            font-size: 13px;
            color: #666;
        }

        .btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="loading" class="loading">Loading your dashboard...</div>

    <div id="app" class="hidden">
        <div class="header">
            <h1 id="userName">Hi 👋</h1>
            <div class="points">⭐ <span id="userPoints">0</span> Points</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="statOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="statCompleted">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Spent</h3>
                <div class="value" id="statSpent">$0</div>
            </div>
        </div>

        <div class="section">
            <h2>📦 Recent Orders</h2>
            <div id="orders"></div>
        </div>

        <div class="section">
            <button class="btn" onclick="openMenu()">🍣 Order Again</button>
        </div>
    </div>

    <script>
        const LIFF_ID = "2008995030-RawExQeM";
        const API_URL = "https://line-app-94vb.onrender.com";

        async function init() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) return liff.login();

            const profile = await liff.getProfile();
            const userRes = await fetch(`${API_URL}/api/user/${profile.userId}`);
            const user = await userRes.json();

            if (user.userRole !== "user") {
                alert("Access denied");
                return liff.closeWindow();
            }

            const dashRes = await fetch(`${API_URL}/api/dashboard/user/${profile.userId}`);
            const dash = await dashRes.json();

            document.getElementById("userName").innerText = `Hi, ${dash.data.user.displayName}`;
            document.getElementById("userPoints").innerText = dash.data.user.points;
            document.getElementById("statOrders").innerText = dash.data.statistics.totalOrders;
            document.getElementById("statCompleted").innerText = dash.data.statistics.completedOrders;
            document.getElementById("statSpent").innerText = "$" + dash.data.statistics.totalSpent;

            renderOrders(dash.data.recentOrders);

            document.getElementById("loading").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
        }

        function renderOrders(orders) {
            const container = document.getElementById("orders");
            if (!orders.length) {
                container.innerHTML = "<p>No orders yet.</p>";
                return;
            }
            container.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="order-header">
          <strong>Order #${o.order_id}</strong>
          <span class="status ${o.order_status}">${o.order_status.toUpperCase()}</span>
        </div>
        <div class="order-details">${o.order_details}</div>
        <div class="order-meta">💰 $${o.total_amount}<br/>📅 ${new Date(o.order_date).toLocaleString()}</div>
      </div>
    `).join("");
        }

        function openMenu() {
            liff.openWindow({
                url: "https://line.me/R/app/2008995030-d47ws6I6",
                external: false
            });
        }

        window.onload = init;
    </script>

</body>

</html>
